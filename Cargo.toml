[package]
name = "raka-portfolio-api"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
vercel_runtime = "2.4"

[[bin]]
name = "rust"
path = "api/rust.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
